<html lang="fr">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#5ec2f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Baloo+2:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Souffle Aventure</title>
    <!-- Matomo: bootstrap only. Page views are sent per route by src/analytics. -->
    <script>
      var _paq = (window._paq = window._paq || []);
      (function () {
        var u = 'https://stats.acolad.net/';
        // No cookie: the parents area states that no personal data is
        // collected, so the client enforces what it can. IP anonymisation
        // stays a server-side setting on the Matomo instance.
        _paq.push(['disableCookies']);
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', '7']);
        var d = document,
          g = d.createElement('script'),
          s = d.getElementsByTagName('script')[0];
        g.async = true;
        g.src = u + 'matomo.js';
        s.parentNode.insertBefore(g, s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
